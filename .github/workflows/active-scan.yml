name: Noname Active Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-scan:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Noname environment configuration
        shell: bash
        env:
          ACTIVE_CONFIG_JSON: ${{ secrets.ACTIVE_CONFIG_JSON }}
        run: |
          set -euo pipefail
          install -d -m 700 "$GITHUB_WORKSPACE/akamai"
          printf '%s' "$ACTIVE_CONFIG_JSON" > "$GITHUB_WORKSPACE/akamai/environment.json"
          chmod 600 "$GITHUB_WORKSPACE/akamai/environment.json"

      - name: Run Noname Active Scan
        uses: nonamesec/active-scan-action@v1
        with:
          ACTIVE_REGISTRY_URL: "jfrog.cicd.nonamesec.com/noname-docker-release"
          ACTIVE_REGISTRY_USER: "_json_key_base64"
          ACTIVE_REGISTRY_PASSWORD: ${{ secrets.ACTIVE_REGISTRY_PASSWORD }}
          ACTIVE_API_URL: "https://192.168.17.228/active"
          ACTIVE_API_TOKEN: ${{ secrets.ACTIVE_API_TOKEN }}
          ACTIVE_BACKEND_URI: "https://192.168.17.228/active/backend"
          TEST_GROUP_ID: "62f5921c-d200-4f6f-a104-29674ad30a94"
          ENV_ID: "21ed1969-2f3c-4627-bd6b-f2dfd9169285"
          VERBOSE: "true"
          ANALYZE: "false"
